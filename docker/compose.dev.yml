services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 layout: the volume is mounted one level up and PGDATA is 18/docker below it.
      - ab_dev_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ab_dev_pg18:
